version: '3.8'

services:
  # MongoDB with bind-mount so data persists in a local folder
  mongodb:
    image: mongo:7.0
    container_name: shonglap-mongo
    ports:
      - "27017:27017"
    volumes:
      # Bind mount: data stored in ./docker-data/mongodb on your PC
      - ./docker-data/mongodb:/data/db
    environment:
      MONGO_INITDB_DATABASE: shonglap
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

